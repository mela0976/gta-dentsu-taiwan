[build]
  command = "npm run build && npm run check"
  publish = "dist"

[[headers]]
  for = "/public/video/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/public/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[redirects]]
  from = "/standalone"
  to = "/gta-dentsu-taiwan-standalone.html"
  status = 200
